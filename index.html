<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epoch</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        font: 12px/1.4 system-ui, sans-serif;
        color: #9fe;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 10px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 10;
      }
      #lineage-panel {
        position: fixed;
        top: 46px;
        left: 8px;
        z-index: 10;
        width: 278px;
        max-height: min(66vh, 620px);
        overflow-y: auto;
        padding: 11px 12px 12px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 7px;
        color: rgba(245,240,229,.82);
        background: rgba(5,13,14,.66);
        backdrop-filter: blur(10px);
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: auto;
        opacity: 0;
        transition: opacity 500ms ease;
      }
      #lineage-panel.visible { opacity: 1; }
      #lineage-panel > header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 9px;
        color: rgba(245,240,229,.6);
        font: 600 9px/1.2 system-ui, sans-serif;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      #lineage-panel > header strong { color: rgba(245,240,229,.86); letter-spacing: .04em; }
      .lineage-node {
        position: relative;
        margin-left: calc(var(--depth) * 20px);
        padding: 7px 8px 7px 10px;
        border-left: 1px solid rgba(173,204,161,.34);
        border-radius: 0 5px 5px 0;
        background: rgba(255,255,255,.035);
      }
      .lineage-node + .lineage-node { margin-top: 6px; }
      .lineage-node:not([style="--depth:0"])::before {
        content: "";
        position: absolute;
        top: -7px;
        left: -21px;
        width: 19px;
        height: 20px;
        border-left: 1px solid rgba(173,204,161,.34);
        border-bottom: 1px solid rgba(173,204,161,.34);
        border-radius: 0 0 0 6px;
      }
      .lineage-node.extinct { opacity: .48; border-left-color: rgba(212,142,119,.6); }
      .lineage-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .lineage-heading strong { color: #f5f0e5; font: 600 11px/1.35 system-ui, sans-serif; }
      .lineage-event { color: rgba(190,218,176,.85); font-size: 9px; text-align: right; }
      .lineage-event.speciated { color: #e8d99f; }
      .lineage-event.extinct { color: #d99880; }
      .lineage-id, .lineage-habitat { display: block; color: rgba(245,240,229,.45); font-size: 9px; }
      .lineage-habitat { margin-top: 2px; color: rgba(173,204,190,.72); }
      .lineage-population { display: flex; gap: 7px; margin-top: 4px; color: rgba(220,205,152,.78); font-size: 9px; }
      .lineage-traits { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
      .lineage-traits span {
        padding: 2px 5px;
        border-radius: 999px;
        color: rgba(245,240,229,.76);
        background: rgba(255,255,255,.07);
        font-size: 9px;
      }
      #lineage-panel footer { margin-top: 9px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.12); }
      #lineage-panel footer strong { color: #f5f0e5; }
      #epoch-card {
        position: fixed;
        right: 28px;
        bottom: 26px;
        z-index: 10;
        color: #f5f0e5;
        text-align: right;
        font-family: ui-serif, Georgia, serif;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        width: min(340px, calc(100vw - 40px));
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 900ms ease, transform 900ms ease;
      }
      #epoch-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      #epoch-card small {
        display: block;
        margin-bottom: 5px;
        font: 600 11px/1.2 system-ui, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.74;
      }
      #epoch-card strong {
        display: block;
        font-size: clamp(26px, 3.5vw, 52px);
        font-weight: 400;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      #epoch-card span {
        display: block;
        margin-top: 4px;
        font: 13px/1.4 system-ui, sans-serif;
        opacity: 0.72;
        text-wrap: balance;
      }
      #experience {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 20;
        width: min(620px, calc(100vw - 40px));
        transform: translateX(-50%);
        color: #f7f3e8;
        text-align: center;
        font-family: system-ui, sans-serif;
        transition: opacity 500ms ease, transform 500ms ease;
      }
      #experience.committed {
        opacity: 0;
        transform: translate(-50%, 18px);
        pointer-events: none;
      }
      body.attract-mode #experience,
      body.attract-mode #status,
      body.attract-mode #lineage-panel,
      body.attract-mode #epoch-card,
      body.capture-mode #experience,
      body.capture-mode #status,
      body.capture-mode #lineage-panel,
      body.capture-mode #epoch-card {
        opacity: 0;
        pointer-events: none;
      }
      body.capture-mode #experience,
      body.capture-mode #status,
      body.capture-mode #lineage-panel,
      body.capture-mode #epoch-card {
        visibility: hidden;
        transition: none;
      }
      #form-title {
        margin: 0 0 5px;
        font: 400 clamp(24px, 3vw, 40px)/1.05 ui-serif, Georgia, serif;
        text-shadow: 0 2px 20px rgba(0,0,0,.8);
      }
      #form-hint {
        margin: 0 0 14px;
        font-size: 13px;
        opacity: .72;
        text-shadow: 0 2px 12px #000;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .force-actions { margin-bottom: 8px; }
      .force-actions select { min-width: 112px; }
      .actions button {
        appearance: none;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        padding: 10px 18px;
        color: #f7f3e8;
        background: rgba(8,20,20,.66);
        backdrop-filter: blur(12px);
        font: 600 12px/1 system-ui, sans-serif;
        letter-spacing: .04em;
        cursor: pointer;
      }
      .actions select {
        appearance: none;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        padding: 10px 34px 10px 16px;
        color: #f7f3e8;
        background: rgba(8,20,20,.66);
        font: 600 12px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .actions button:hover, .actions button.active {
        background: rgba(98,128,97,.82);
        border-color: rgba(255,255,255,.5);
      }
      #jump {
        margin-left: 8px;
        padding-inline: 24px;
        background: #e7dfc9;
        color: #172320;
        border-color: transparent;
      }
      #jump-veil {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 45%, rgba(221,230,211,.08), rgba(5,13,14,.84));
      }
      #jump-veil.active { animation: epoch-jump 2s ease both; }
      @keyframes epoch-jump {
        0% { opacity: 0; }
        48% { opacity: 1; }
        100% { opacity: 0; }
      }
      @media (max-width: 700px) {
        #epoch-card { right: 18px; bottom: 210px; }
        .actions { flex-wrap: wrap; }
      }
      @media (min-width: 701px) and (max-width: 1100px) {
        #epoch-card { bottom: 190px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">loading…</div>
    <aside id="lineage-panel" aria-label="Lineage changes"></aside>
    <div id="jump-veil"></div>
    <div id="experience">
      <div id="form-title">Shape the island</div>
      <p id="form-hint">Drag to orbit. Scroll to move closer. Choose a shaping tool when the form calls for it.</p>
      <div class="actions force-actions" aria-label="Climate forces">
        <select id="rainfall" aria-label="Rainfall regime">
          <option value="arid">Arid</option>
          <option value="temperate" selected>Temperate rain</option>
          <option value="wet">Wet</option>
        </select>
        <select id="temperature" aria-label="Temperature regime">
          <option value="cold">Cold</option>
          <option value="mild" selected>Mild</option>
          <option value="warm">Warm</option>
        </select>
        <select id="wind" aria-label="Prevailing wind">
          <option value="calm">Calm</option>
          <option value="westerly" selected>West wind</option>
          <option value="easterly">East wind</option>
        </select>
        <select id="sea-level" aria-label="Sea level">
          <option value="low">Low sea</option>
          <option value="present" selected>Present sea</option>
          <option value="high">High sea</option>
        </select>
      </div>
      <div class="actions">
        <button class="active" data-tool="look">Look</button>
        <button data-tool="raise">Raise land</button>
        <button data-tool="carve">Carve</button>
        <select id="jump-years" aria-label="Jump duration">
          <option value="1">1 year</option>
          <option value="5">5 years</option>
          <option value="10">10 years</option>
          <option value="25">25 years</option>
          <option value="50">50 years</option>
          <option value="100">100 years</option>
          <option value="1000" selected>1,000 years</option>
          <option value="10000">10,000 years</option>
          <option value="100000">100,000 years</option>
          <option value="1000000">1 million years</option>
        </select>
        <button id="jump">Jump 1,000 years</button>
      </div>
    </div>
    <div id="epoch-card">
      <small>Landing state</small>
      <strong id="world-age">Year 1,000</strong>
      <span id="landing-summary">Temperate coast · two diverged grazer populations</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
